services:
  mongodb:
    image: mongo:7.0
    container_name: novabet-mongodb
    restart: always
    ports:
      - '27017:27017'
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: |
        mongosh --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            }).ok
          }
        "
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
